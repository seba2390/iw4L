name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run, so a superseded
# commit holds no runner; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make publish-check
        run: make publish-check

  # Formatting: every Rust file as `cargo fmt` writes it, and the Python
  # scripts as ruff writes them.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: ruff check scripts
        run: pipx run ruff==0.17.1 check scripts
      - name: ruff format --check scripts
        run: pipx run ruff==0.17.1 format --check scripts

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      # Fails on any rustc warning.
      - name: cargo check --workspace --all-targets
        shell: bash
        run: |
          cargo check --workspace --all-targets 2>&1 | tee check.log
          if grep -q '^warning' check.log; then
            echo "::error::rustc warnings above: fix them"
            exit 1
          fi
      # Clippy and rustc warnings may only go down (xtask/lints/allow.txt).
      # Linux only: the counts are taken there.
      - name: cargo xtask lints --enforce
        if: runner.os == 'Linux'
        run: cargo run -q -p xtask -- lints --enforce
      - name: Headless network impairment scenarios
        run: cargo run -p approved_tests -- network_impairments --seed 1234 --require-baseline-smoothness 1
      - name: Short-disruption presentation recovery
        run: cargo run -p approved_tests -- network_impairments --profile burst --workload motion --require-recovery 1 --require-baseline-smoothness 1
      - name: Latency-drop presentation recovery
        run: |
          cargo run -p approved_tests -- network_impairments --profile latency --require-recovery 1 --require-baseline-smoothness 1
          cargo run -p approved_tests -- network_impairments --profile latency --workload motion --require-recovery 1 --require-baseline-smoothness 1
      - name: Network impairment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-impairments
          path: iw4l-artifacts/approved-tests/*-network_impairments-*/run.json
          if-no-files-found: ignore
